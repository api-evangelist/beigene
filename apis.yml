name: BeiGene
description: 'BeiGene (rebranded as BeOne Medicines in 2025) is a global oncology biopharmaceutical company
  founded in 2010, developing and commercializing cancer therapies worldwide. Its portfolio spans blood cancers
  and solid tumors, led by BRUKINSA (zanubrutinib), a BTK inhibitor, alongside programs in protein degradation
  (CDACs) and antibody-drug conjugates (ADCs). The company is listed on NASDAQ (BGNE), HKEX, and the Shanghai
  STAR Market, with a global footprint across 30+ countries (beonemedicines.com). Surfaced as a portfolio
  company of Hillhouse; no public developer portal, API, or SDK program is currently published.'
